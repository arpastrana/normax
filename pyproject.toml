[project]
name = "normax"
version = "0.1"
description = "Backpropagating through structural engineering codes"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "Rafael Pastrana"}]
license = "Apache-2.0"
classifiers = []
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.0",
    "jaxtyping>=0.3.11",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "tesseract-core[runtime]>=1.11.0",
    "tesseract-jax>=0.4.1",
]

[tool.setuptools.packages.find]
include = ["normax*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
]
pipeline = [
    # LGPL-2.1, experiment-only, waived 2026-08-15 while the blueprint sizer is prototyped.
    "blue-prints>=0.7.1",
    "ec3x",
    "jax-fdm>=0.14.0",
    "matplotlib>=3.11.1",
    "smax",
]
viz = [
    "polyscope>=2.6.1",
    "vix",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]  # keeps the aligned comments in ROADMAP.md's code fences

[tool.ruff.lint]
select = [
    "D202",  # no blank line after function/method docstring
    "D300",  # use triple double quotes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
]
ignore = [
    "F722",  # jaxtyping annotations use empty-string shapes
    "F821",  # jaxtyping dimension variable names (e.g. "nodes")
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"normax/__init__.py" = ["E402", "F401"]  # re-exports after the JAX config
"normax/analysis/__init__.py" = ["E402", "F401"]  # backend re-exports at the bottom
"normax/form_finding/__init__.py" = ["E402", "F401"]  # backend re-exports at the bottom
"normax/sizing/__init__.py" = ["E402", "F401"]  # backend re-exports at the bottom
"tests/*" = ["E712", "E501"]  # JAX bool comparisons; relaxed line length

[tool.uv.sources]
ec3x = { path = "../ec3x", editable = true }
smax = { git = "file:///Users/arpj/code/libraries/smax", rev = "main" }
vix = { git = "file:///Users/arpj/code/libraries/vix", rev = "main" }


[project.urls]
Homepage = "https://github.com/arpastrana/normax"
Changelog = "https://github.com/arpastrana/normax/releases"
Issues = "https://github.com/arpastrana/normax/issues"
CI = "https://github.com/arpastrana/normax/actions"

[project.optional-dependencies]
spike = [
    "nlopt>=2.11.0",
    "openseespy>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto fans the suite across cores; -n0 serializes. loadfile is measured faster.
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-v",
    "-n",
    "auto",
    "--dist",
    "loadfile",
]
