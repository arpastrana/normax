# The arch, and the settings a design of it is searched for under. Millimeters
# and newtons throughout, so a mass comes out in tonnes and a force density in
# newtons per millimeter.
structure:
  num_edges: 10
  span: 10000.0
  rise: 3000.0

# Every force density starts here. Negative in compression.
sketch:
  force_density: -80.0

# The first case shapes the arch; every case is checked.
load_cases:
  - name: uniform
    magnitude: 180000.0
  - name: half_span
    magnitude: 90000.0
  - name: half_span
    magnitude: 90000.0
    options: {mirrored: true}

analysis:
  diameter: 250.0
  # opensees crosses a Tesseract boundary to a planar host solver carrying
  # DDM sensitivities; pynite is the space-frame host with a hand adjoint.
  backend: opensees

sizing:
  section_class: 3
  # blueprint is Blueprints' cross-section check, across a Tesseract
  # boundary. Blueprints implements no 6.3.1 buckling.
  backend: blueprint

# No held-plan subspace: an arch is a chain, whose held plan has one degree
# of freedom, so every force density moves on its own inside the bounds.
subspace: null

constraints:
  diameter_floor: 21.3
  # Without a floor the search collapses members instead of improving the
  # form, a member being both free and unbucklable as it vanishes.
  length_floor: 600.0
  rise_ceiling: null
  sag_floor: null
  # Not a design constraint: the bounds keep the densities away from zero,
  # where the force density system is singular.
  bounds: {min: -100.0, max: -1.0e-3}

# The opening penalty is the one setting that decides the answer rather than
# the speed; every other entry is a budget. Signed exponents, or YAML reads
# them as strings.
augmented:
  rounds: 10
  iterations: 400
  settled: 100
  opening: 3
  penalty: 0.1
  growth: 10.0
  ceiling: 1.0e+8
  tolerance: 1.0e-6
  quiet: 1.0e-6

# What becomes of the answer; a viewer blocks, so it opens last.
output:
  verbose: true
  export: true
  viewer: false
