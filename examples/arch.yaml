# The arch, and the settings a design of it is searched for under. Millimeters
# and newtons throughout, so a mass comes out in tonnes and a force density in
# newtons per millimeter.
structure:
  num_edges: 10
  span: 10000.0
  rise: 2500.0

# The held plan in member coordinates: a chain leaves one independent density.
form_finding:
  # fdm finds the shape by equilibrium in the force densities; heights
  # writes the free nodes' height; fixed never moves the drawn geometry.
  shape_parametrization: fdm
  basis: pivoted
  # A chain needs no symmetry to fold: its held plan is one-dimensional already.
  mirror: null
  # UniformDensityInitializer: one force density in every member. The rise a
  # funicular chain reaches is 250000/|q| mm here, so -100 opens every route on
  # the same 2500 mm parabola the structure above is drawn at.
  density_start: {force_density: -100.0}

# The first case shapes the arch; every case is checked.
load_cases:
  - name: uniform
    magnitude: 180000.0
  - name: half_span
    magnitude: 90000.0
  - name: half_span
    magnitude: 90000.0
    options: {mirrored: true}

analysis:
  # UniformDiameterInitializer: one outer diameter in every member.
  diameter_start: {diameter: 250.0}
  # opensees crosses a Tesseract boundary to a planar host solver carrying
  # DDM sensitivities; pynite is the space-frame host with a hand adjoint.
  backend: opensees

sizing:
  section_class: 3
  # blueprint is Blueprints' cross-section check, across a Tesseract
  # boundary. Blueprints implements no 6.3.1 buckling.
  backend: blueprint
  fold_mirror: false
  fold_polar: false

constraints:
  diameter_min: 21.3
  # A held plan bounds every member length by its plan projection.
  length_min: 0.0
  # Held by every parametrization alike: as rows where the coefficients are
  # densities, and as a plain box where they are the heights themselves.
  rise_max: 3000.0
  sag_min: 0.0
  # No sign guard: a chain has one sign, and the bounds keep it.
  sign_margin_fraction: 0.0
  sign_guard: null
  # The one coordinate is a member's own density: the box keeps it in
  # compression and away from zero, where the force density system is singular.
  # The floor is deep enough not to bind -- the chain's optimum sits at |q| 179,
  # and -300 lands on the same answer -- so the shape the search settles on is
  # the funicular optimum rather than the edge of its own box.
  bounds: {min: -200.0, max: -1.0e-3}

# The opening penalty is the one setting that decides the answer rather than
# the speed; every other entry is a budget. Signed exponents, or YAML reads
# them as strings.
optimization:
  rounds_max: 10                # most multiplier updates, the outer rounds, to spend
  rounds_warmup: 3              # first rounds given the larger inner budget
  iterations_warmup: 400        # most L-BFGS-B iterations in each warmup round
  iterations_after_warmup: 50   # most L-BFGS-B iterations in every later round
  penalty_start: 0.1            # penalty parameter of the first round
  penalty_growth: 10.0          # penalty multiplier when a round earns too little
  penalty_cap: 1.0e+8           # largest penalty and multiplier the loop may reach
  violation_tol: 1.0e-6         # worst violation at which the rows count as satisfied
  objective_rtol: 1.0e-4        # relative objective change per round counting as none

# What becomes of the answer; a viewer blocks, so it opens last.
output:
  verbose: true
  export: true
  viewer: false
