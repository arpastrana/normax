# The Warren truss, composed across two Tesseract boundaries: jax-fdm in
# process, OpenSees across the analysis schema, Blueprints across the check.
# Millimeters and newtons throughout.
structure:
  num_bays: 8
  span: 10000.0
  depth: 1000.0

# The lens the start is fitted to: bottom chord hung, top chord arched.
sketch:
  sag_lens: 600.0
  rise_lens: 800.0

# Every case sits on the deck. The first shapes the truss; every case is
# checked. The mirrored half-span case is a reindexing of the near one on a
# symmetric design, so it is left out.
load_cases:
  - name: deck
    magnitude: 180000.0
  - name: deck_half
    magnitude: 180000.0
    options: {factor: 0.5}
  - name: deck_point
    magnitude: 90000.0

analysis:
  diameter: 100.0
  # A planar host solver across the analysis schema, carrying DDM
  # sensitivities of its own rather than a traced gradient.
  backend: opensees

sizing:
  section_class: 3
  # The check crosses its own boundary too, so neither solver on the far side
  # differentiates itself. Blueprints implements no 6.3.1 buckling.
  backend: blueprint

# The held-plan subspace the densities move in: an orthonormal basis, folded
# by the midspan mirror. The margin signs the chords at the start alone.
subspace:
  symmetric: true
  pivoted: false
  margin_fraction: 0.1

constraints:
  diameter_floor: 21.3
  length_floor: 500.0
  rise_ceiling: 2000.0
  sag_floor: -1000.0
  bounds: null

# The opening penalty is the one setting that decides the answer rather than
# the speed; this truss is flat across two decades of it, so the conservative
# end is kept.
augmented:
  rounds: 10
  iterations: 400
  settled: 100
  opening: 3
  penalty: 0.1
  growth: 10.0
  ceiling: 1.0e+8
  tolerance: 1.0e-6
  quiet: 1.0e-6

viewer: false
