# The Warren truss, composed across two Tesseract boundaries: jax-fdm in
# process, OpenSees across the analysis schema, Blueprints across the check.
# Blueprints implements no 6.3.1, so this sizes to 6.2 alone.
structure:
  num_bays: 8
  span: 10000.0
  depth: 1000.0

loads:
  total: 180000.0
  half_factor: 0.5
  point_factor: 0.5
  mirrored_case: false

sketch:
  sag_lens: 600.0
  rise_lens: 800.0

subspace:
  symmetric: true
  basis: svd
  margin_fraction: 0.1

analysis:
  diameter: 100.0
  # A planar host solver across the analysis schema, carrying DDM
  # sensitivities of its own rather than a traced gradient.
  backend: opensees

sizing:
  # The check crosses its own boundary too, so neither solver on the far
  # side differentiates itself.
  backend: blueprint_tesseract

descent:
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-9
  diameter_floor: 21.3
  length_floor: 500.0
  starts: 1
  scatter: 0.0
  limit_rise: true
  rise_factor: 2.0
  limit_sag: true
  sag_factor: 1.0

viewer:
  enabled: false
  search: end to end
  # Descend that one search alone, for iterating rather than reporting:
  # every comparison entry needs the searches it compares.
  solo_search: false

# Budgets for `method: augmented`, read whether or not the method names it.
# The opening penalty is the one setting that decides the answer rather than
# the speed, and no value is safe on every structure — this truss is flat from
# 1.0 to 0.003 where the Vierendeel is not, so the conservative end is kept.
augmented:
  rounds: 10
  iterations: 400
  settled: 100
  opening: 3
  penalty: 0.1
  growth: 10.0
  # Signed exponent, or YAML reads this as a string.
  ceiling: 1.0e+8
  tolerance: 1.0e-6
  quiet: 1.0e-6
