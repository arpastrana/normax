# The 16x16 gridshell, composed across two Tesseract boundaries: jax-fdm in
# process, PyNite across the analysis schema, Blueprints across the check.
# Millimeters and newtons throughout.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false

# The held plan, thirteen wide, folded by the mirror through spoke zero.
form_finding:
  basis: svd
  mirror: y
  force_density: drawn

# No start: the drawn cap is already funicular under its own pressure.
start: null

# The load is a pressure on the plan, spread by tributary area, so the boundary
# ring's share goes straight to ground. The two drifts are mirror images, each
# rescaled to the uniform total so no case wins by carrying less.
load_cases:
  - name: tributary
    magnitude: 1.0e-3
  - name: sector
    magnitude: 1.0e-3
    options: {center: 3, spokes: 3, factor: 0.5}
  - name: sector
    magnitude: 1.0e-3
    options: {center: 13, spokes: 3, factor: 0.5}

analysis:
  diameter: 100.0
  # A space frame solver that carries no derivative of its own, reached across
  # the analysis schema. Its adjoint is this repository's.
  backend: pynite

sizing:
  section_class: 3
  # The check across its own boundary as well, so the descent crosses twice.
  backend: blueprint
  fold_mirror: true
  # One section per ring per family, a fabrication constraint no drift can argue with.
  fold_polar: true

constraints:
  diameter_min: 21.3
  # A held plan bounds every member length by its plan projection.
  length_min: 0.0
  rise_max: 5000.0
  sag_min: 0.0
  # Holds every guarded density in compression through the descent.
  sign_margin_fraction: 0.01
  # The radials alone: meridian compression carries a cap; hoop tension is membrane.
  sign_guard: {radial: compression}
  bounds: null

# A small opening penalty, so the mass leads and the search crosses the
# infeasible region: measured to reach the record five scattered starts found.
optimization:
  rounds_max: 12                # most multiplier updates, the outer rounds, to spend
  rounds_warmup: 3              # first rounds given the larger inner budget
  iterations_warmup: 400        # most L-BFGS-B iterations in each warmup round
  iterations_after_warmup: 50   # most L-BFGS-B iterations in every later round
  penalty_start: 0.01           # penalty parameter of the first round
  penalty_growth: 10.0          # penalty multiplier when a round earns too little
  penalty_cap: 1.0e+8           # largest penalty and multiplier the loop may reach
  violation_tol: 1.0e-6         # worst violation at which the rows count as satisfied
  objective_rtol: 1.0e-6        # relative objective change per round counting as none

# What becomes of the answer; a viewer blocks, so it opens last.
output:
  verbose: true
  export: true
  viewer: false
