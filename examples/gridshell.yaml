# The 16x16 gridshell, composed across two Tesseract boundaries: jax-fdm in
# process, PyNite across the analysis schema, Blueprints across the check.
# Millimeters and newtons throughout.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  # Fold the diameters by the polar symmetry as well as the mirror: one
  # section per ring per family, a fabrication constraint the drift cases
  # cannot argue with.
  polar_diameters: true
  # Guard the radials alone: meridian compression is what makes a cap carry
  # as an arch, while hoop tension in the lower rings is the membrane response.
  guard_hoops: false

# No sketch: the drawn cap is already funicular under its own pressure.
sketch: null

# The load is a pressure on the plan, spread by tributary area, so the boundary
# ring's share goes straight to ground. The two drifts are mirror images, each
# rescaled to the uniform total so no case wins by carrying less.
load_cases:
  - name: tributary
    magnitude: 1.0e-3
  - name: sector
    magnitude: 1.0e-3
    options: {center: 3, spokes: 3, factor: 0.5}
  - name: sector
    magnitude: 1.0e-3
    options: {center: 13, spokes: 3, factor: 0.5}

analysis:
  diameter: 100.0
  # A space frame solver that carries no derivative of its own, reached across
  # the analysis schema. Its adjoint is this repository's.
  backend: pynite

sizing:
  section_class: 3
  # The check across its own boundary as well, so the descent crosses twice.
  backend: blueprint

# The held-plan subspace is thirteen wide; the margin holds every guarded
# density in compression through the descent.
subspace:
  symmetric: true
  pivoted: false
  margin_fraction: 0.01

constraints:
  diameter_floor: 21.3
  # A held plan bounds every member length by its plan projection.
  length_floor: 0.0
  rise_ceiling: 5000.0
  sag_floor: 0.0
  bounds: null

# A small opening penalty, so the mass leads and the search crosses the
# infeasible region: measured to reach the record five scattered starts found.
augmented:
  rounds: 10
  iterations: 400
  settled: 100
  opening: 3
  penalty: 0.01
  growth: 10.0
  ceiling: 1.0e+8
  tolerance: 1.0e-6
  quiet: 1.0e-6

viewer: false
