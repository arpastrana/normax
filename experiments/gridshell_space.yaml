# The 16x16 gridshell's design space, sampled. Millimeters and newtons.
# The structure, the loading and the subspace are exactly experiment 23's, so
# what is drawn here is the space the reported answer was found in.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  polar_diameters: true
  polar_heights: true
  guard_hoops: false

loads:
  pressure: 1.0e-3
  sector_spokes: 3
  sector_center: 3
  drift_factor: 0.5
  asymmetric_cases: true

subspace:
  # Off, so the sampling sees the whole held-plan space rather than the
  # mirror-symmetric slice the optimization searches: 29 independents
  # against 23, and a shape free to be lopsided about every plane.
  symmetric: false
  # Pivoted, so a coordinate is the density of one named member and a
  # perturbation is a statement about an edge rather than about a direction.
  basis: pivoted
  margin_fraction: 0.01

space:
  # How many perturbed shapes to form-find, beside the drawn cap.
  samples: 5
  # Spread of the perturbation, as a fraction of each independent density.
  spread: 0.3
  # Fixed, so the picture is a measurement rather than a lottery.
  seed: 20260823
  # Most draws to make before giving up on filling the sample count. A draw
  # that leaves the compression cone or will not factorize is discarded.
  attempts: 2000
  # Off, so what is drawn is every held-plan equilibrium the plan admits
  # rather than the sliver the search moves through. Measured before it was
  # decided: the guard refused 99.98% of draws, no draw ever failed to
  # factorize with it off, and the sag floor keeps the shapes domes anyway.
  guarded: false

# Read by the shared parser, and unused here: nothing is analyzed, sized or
# descended, so these carry whatever experiment 23 carries.
analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-6
  diameter_floor: 21.3
  length_floor: 0.0
  starts: 5
  scatter: 0.15
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: false
  route: end to end
  solo_route: false
