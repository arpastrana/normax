# The gridshell experiment 23 optimizes, in millimeters and newtons.
structure:
  num_rings: 4
  num_spokes: 12
  radius: 5000.0
  rise: 2000.0
  # An open crown deletes the apex and its spoke of members, and with them
  # most of the freedom a held plan leaves.
  oculus: false
  # Fold the sections by the polar symmetry too: one diameter per ring
  # per family, a fabrication constraint the drift cases cannot argue with.
  # Triangulate the panels, both diagonals. It is what widens the held-plan
  # basis: a quad cap leaves a fraction of its free nodes, a braced one several times.
  braced: false
  polar_diameters: false
  # Folding the heights the same way makes the two shaped routes search
  # spaces of equal dimension, neither inside the other.
  polar_heights: false
  # Off leaves the lower hoops free to take the membrane tension a dome asks
  # of them; on designs a wholly compressive net instead.
  guard_hoops: false

loads:
  # Newtons per square millimeter: 1.0e-3 is 1 kN/m2 of plan.
  pressure: 1.0e-3
  # Odd, so it centres on a spoke; off the mirror plane, so its reflection is
  # a second case rather than the same one twice.
  sector_spokes: 3
  sector_center: 3
  drift_factor: 0.5
  # Off leaves the uniform pressure alone, whose every symmetry the
  # structure shares — a symmetry check rather than a design run.
  asymmetric_cases: true

subspace:
  symmetric: true
  basis: svd
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-10
  diameter_floor: 21.3
  # A held plan floors every length at its own plan projection, so no row is
  # ever emitted; the field stays because the shared budgets carry it.
  length_floor: 0.0
  # The landscape is multi-basin, so each route is descended from several
  # scattered starts and the lightest feasible landing is kept.
  starts: 5
  scatter: 0.15
  # Both limits are multiples of the plan radius, which is half the span:
  # a ceiling at half the span, and a floor on the plane of the supports.
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: false
  route: end to end
  # Descend that one route alone, for iterating rather than reporting:
  # every comparison entry needs the routes it compares.
  solo_route: false
