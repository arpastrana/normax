# The gridshell experiment 23 optimizes, in millimeters and newtons.
structure:
  num_rings: 4
  num_spokes: 12
  radius: 5000.0
  rise: 2000.0

loads:
  # Newtons per square millimeter: 1.0e-3 is 1 kN/m2 of plan.
  pressure: 1.0e-3
  # Odd, and centred on spoke zero, so the drift shares the design's mirror.
  sector_spokes: 3
  drift_factor: 0.5
  point_factor: 0.5

subspace:
  symmetric: true
  basis: svd
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-10
  diameter_floor: 21.3
  # A held plan floors every length at its own plan projection, so no row is
  # ever emitted; the field stays because the shared budgets carry it.
  length_floor: 0.0
  limit_rise: true
  rise_factor: 2.0
  limit_sag: true
  sag_factor: 1.0

viewer:
  enabled: false
  route: end to end
