# The same baseline under the augmented method, eight starts. Finds
# 0.417633 t — 3.0% lighter, feasible, and unreachable from any SLSQP
# start. The route is multi-modal at frozen geometry, so the Vierendeel
# headline divides by this and reads 70.7%.
structure:
  num_bays: 8
  span: 10000.0
  depth: 1000.0

loads:
  total: 180000.0
  half_factor: 0.5
  point_factor: 0.5
  mirrored_case: false

sketch:
  sag_lens: 600.0
  rise_lens: 800.0

subspace:
  symmetric: true
  basis: pivoted
  margin_fraction: 0.1

analysis:
  diameter: 100.0

descent:
  method: augmented
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-9
  diameter_floor: 21.3
  length_floor: 1000.0
  starts: 8
  scatter: 0.15
  limit_rise: true
  rise_factor: 2.0
  limit_sag: true
  sag_factor: 1.0

viewer:
  enabled: false
  route: sizing only
  # Descend that one route alone, for iterating rather than reporting:
  # every comparison entry needs the routes it compares.
  solo_route: true
