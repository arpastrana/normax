# The 16x16 gridshell, end to end, in millimeters and newtons.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  # Fold the sections by the polar symmetry as well as the mirror: one
  # diameter per ring per family, a fabrication constraint the drift cases
  # cannot argue with.
  polar_diameters: true
  polar_heights: true
  guard_hoops: false

loads:
  pressure: 1.0e-3
  sector_spokes: 3
  sector_center: 3
  drift_factor: 0.5
  asymmetric_cases: true

subspace:
  symmetric: true
  basis: svd
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  # Relative to the mass at the start, which is what SLSQP's own test
  # compares against once the objective is normalized.
  tolerance: 1.0e-6
  diameter_floor: 21.3
  length_floor: 0.0
  starts: 5
  scatter: 0.15
  # Read a stored answer back instead of descending to it again. Every run
  # writes its answers whatever this says; only reading them is a decision.
  reuse_answers: true
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: false
  route: end to end
  solo_route: false
