# The Vierendeel from five starts by the augmented method, for the
# augmented column of the same comparison.
structure:
  num_bays: 8
  span: 10000.0
  depth: 1000.0

loads:
  total: 180000.0
  half_factor: 0.5
  point_factor: 0.5
  mirrored_case: false

sketch:
  sag_lens: 600.0
  rise_lens: 800.0

subspace:
  symmetric: true
  basis: pivoted
  margin_fraction: 0.1

analysis:
  diameter: 100.0

descent:
  method: augmented
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-9
  diameter_floor: 21.3
  length_floor: 1000.0
  starts: 5
  scatter: 0.15
  limit_rise: true
  rise_factor: 2.0
  limit_sag: true
  sag_factor: 1.0

viewer:
  enabled: false
  search: end to end
  # Descend that one search alone, for iterating rather than reporting:
  # every comparison entry needs the searches it compares.
  solo_search: false
