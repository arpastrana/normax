# The Vierendeel of experiment 19 with the analysis crossed and the check kept.
# Isolates the boundary from the check: OpenSees across the analysis schema, EN
# 1993-1-1 in process, so any gap against the baseline is the boundary alone.
structure:
  num_bays: 8
  span: 10000.0
  depth: 1000.0

loads:
  total: 180000.0
  half_factor: 0.5
  point_factor: 0.5
  mirrored_case: false

sketch:
  sag_lens: 600.0
  rise_lens: 800.0

subspace:
  symmetric: true
  basis: pivoted
  margin_fraction: 0.1

analysis:
  diameter: 100.0
  backend: opensees

sizing:
  backend: ec3

descent:
  iterations: 1000
  rounds: 5
  tolerance: 1.0e-9
  diameter_floor: 21.3
  length_floor: 1000.0
  starts: 1
  scatter: 0.0
  limit_rise: true
  rise_factor: 2.0
  limit_sag: true
  sag_factor: 1.0

viewer:
  enabled: false
  route: end to end
  # Descend that one route alone, for iterating rather than reporting:
  # every comparison entry needs the routes it compares.
  solo_route: false
