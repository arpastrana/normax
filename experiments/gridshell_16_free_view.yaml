# The unfolded 16x16 answer, opened rather than descended.
# Same descent as gridshell_16_free.yaml, so it reads that run's stored
# answer back; only the viewer differs.
# Everything else is gridshell_16.yaml, so the only thing that moved is
# whether the shape has to answer to its own reflection.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  # Fold the sections by the polar symmetry as well as the mirror: one
  # diameter per ring per family, a fabrication constraint the drift cases
  # cannot argue with.
  polar_diameters: true
  polar_heights: true
  guard_hoops: false

loads:
  pressure: 1.0e-3
  sector_spokes: 3
  sector_center: 3
  drift_factor: 0.5
  asymmetric_cases: true

subspace:
  # Off. The geometry searches the whole held-plan space, 29 coordinates
  # against 23, and a shape may be lopsided about every plane. The sections
  # keep their polar folding regardless, that being fabrication's decision.
  symmetric: false
  basis: svd
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  # Relative to the mass at the start, which is what SLSQP's own test
  # compares against once the objective is normalized.
  tolerance: 1.0e-6
  diameter_floor: 21.3
  length_floor: 0.0
  starts: 5
  scatter: 0.15
  # Read a stored answer back instead of descending to it again. Every run
  # writes its answers whatever this says; only reading them is a decision.
  reuse_answers: true
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: true
  route: end to end
  # Draw this case alone. Empty would draw all three, which is three
  # assemblies and three solves for one shape.
  load_case: LC1
  # Load glyphs at three times their own size. A kilonewton on a ten
  # metre shell is invisible drawn true.
  load_scale: 3.0
  solo_route: true
