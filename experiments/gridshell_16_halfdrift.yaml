# The 16x16 gridshell drifted over half its plan rather than a fifth.
# Everything is gridshell_16_pivoted.yaml's but the sector width and the
# round budget: a wider one-sided load, to see whether corrugation comes
# out of the loading rather than out of a lucky start.
# Every problem setting is gridshell_16.yaml's; the search is handed the
# whole 29-coordinate subspace instead of its mirror-symmetric slice, so a
# design need not answer to its own reflection.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  # Fold the sections by the polar symmetry as well as the mirror: one
  # diameter per ring per family, a fabrication constraint the drift cases
  # cannot argue with.
  polar_diameters: true
  polar_heights: true
  guard_hoops: false

loads:
  pressure: 1.0e-3
  # Nine of sixteen, the odd width nearest half the circle. Centred on
  # spoke 3 it covers 15,0,1,2,3,4,5,6,7; its mirror on spoke 13 covers
  # 9..15,0,1. The two overlap on three spokes and together cover the cap.
  sector_spokes: 9
  sector_center: 3
  drift_factor: 0.5
  asymmetric_cases: true

subspace:
  # Off. The full basis, 29 coordinates against 23.
  symmetric: false
  # Pivoted rather than orthonormal: each coordinate is the density of one
  # member QR pivoting elected independent. It spans the identical subspace
  # the svd basis does, so nothing about which designs are reachable moves —
  # only the coordinates the search takes its steps in, and their
  # conditioning, which legibility is bought at the price of.
  basis: pivoted
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  rounds: 5
  # Relative to the mass at the start, which is what SLSQP's own test
  # compares against once the objective is normalized.
  tolerance: 1.0e-6
  diameter_floor: 21.3
  length_floor: 0.0
  starts: 5
  scatter: 0.15
  # Read a stored answer back instead of descending to it again. Every run
  # writes its answers whatever this says; only reading them is a decision.
  reuse_answers: true
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: false
  search: end to end
  solo_search: true
