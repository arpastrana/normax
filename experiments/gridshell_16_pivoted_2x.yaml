# The 16x16 gridshell at twice the pressure, everything else held.
# Form finding is exactly scale invariant — the equilibrium is linear in q
# and in the load, and the held-plan basis never sees a load at all — so the
# reachable shapes and the multiplicative scatter cloud are unchanged. Only
# the code check responds, which is what this asks about: how much of the
# funicular's advantage was the catalogue floor rather than EN 1993-1-1.
# Every problem setting is gridshell_16.yaml's; the search is handed the
# whole 29-coordinate subspace instead of its mirror-symmetric slice, so a
# design need not answer to its own reflection.
structure:
  num_rings: 16
  num_spokes: 16
  radius: 5000.0
  rise: 2000.0
  oculus: false
  braced: false
  # Fold the sections by the polar symmetry as well as the mirror: one
  # diameter per ring per family, a fabrication constraint the drift cases
  # cannot argue with.
  polar_diameters: true
  polar_heights: true
  guard_hoops: false

loads:
  # Two kilonewtons per square metre of plan, twice the reported run.
  pressure: 2.0e-3
  sector_spokes: 3
  sector_center: 3
  drift_factor: 0.5
  asymmetric_cases: true

subspace:
  # Off. The full basis, 29 coordinates against 23.
  symmetric: false
  # Pivoted rather than orthonormal: each coordinate is the density of one
  # member QR pivoting elected independent. It spans the identical subspace
  # the svd basis does, so nothing about which designs are reachable moves —
  # only the coordinates the search takes its steps in, and their
  # conditioning, which legibility is bought at the price of.
  basis: pivoted
  margin_fraction: 0.01

analysis:
  diameter: 100.0

descent:
  iterations: 1000
  # Three. Measured on this same problem: rounds one and two find the
  # design, the third is what reaches feasibility after the line search
  # breaks down, and a fourth moves one iteration and stops the loop.
  rounds: 3
  # Relative to the mass at the start, which is what SLSQP's own test
  # compares against once the objective is normalized.
  tolerance: 1.0e-6
  diameter_floor: 21.3
  length_floor: 0.0
  starts: 5
  scatter: 0.15
  # Read a stored answer back instead of descending to it again. Every run
  # writes its answers whatever this says; only reading them is a decision.
  reuse_answers: true
  limit_rise: true
  rise_factor: 1.0
  limit_sag: true
  sag_factor: 0.0

viewer:
  enabled: false
  route: end to end
  solo_route: true
